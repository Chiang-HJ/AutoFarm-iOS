name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Precompiled FFI Library
        run: |
          mkdir -p Vendor/idevice
          echo "Downloading libidevice_ffi.a (precompiled universal library)..."
          curl -L --retry 3 -o Vendor/idevice/libidevice_ffi.a "https://raw.githubusercontent.com/ChrisMack32/Locus/main/Vendor/idevice/libidevice_ffi.a"
          ls -lh Vendor/idevice/

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App with xcodebuild
        run: |
          set -o pipefail
          xcodebuild build \
            -project AutoFarmGPS.xcodeproj \
            -scheme AutoFarmGPS \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT=$PWD/build 2>&1 | tee build.log || (echo "=== BUILD ERROR SUMMARY ===" && grep -C 3 -i "error:" build.log && exit 1)

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -qr AutoFarm-iOS.ipa Payload
          rm -rf Payload
          ls -lh AutoFarm-iOS.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFarm-iOS-ipa
          path: AutoFarm-iOS.ipa
