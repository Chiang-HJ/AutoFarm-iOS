name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Precompiled FFI Library
        run: |
          mkdir -p Vendor/idevice
          echo "Downloading libidevice_ffi.a (precompiled universal library)..."
          curl -L --retry 3 -o Vendor/idevice/libidevice_ffi.a "https://raw.githubusercontent.com/ChrisMack32/Locus/main/Vendor/idevice/libidevice_ffi.a"
          ls -lh Vendor/idevice/

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App Archive (Unsigned)
        run: |
          xcodebuild -project AutoFarmGPS.xcodeproj \
            -scheme AutoFarmGPS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AutoFarmGPS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoFarmGPS.xcarchive/Products/Applications/AutoFarmGPS.app Payload/
          zip -qr AutoFarm-iOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh AutoFarm-iOS-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFarm-iOS-unsigned
          path: AutoFarm-iOS-unsigned.ipa
          retention-days: 7
